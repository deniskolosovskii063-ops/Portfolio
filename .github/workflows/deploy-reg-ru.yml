name: Deploy to REG.RU

# Автодеплой по push отключён после инцидента с продом — только вручную из вкладки Actions.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Add SPA fallback rules for Apache
        run: |
          cat > dist/.htaccess <<'EOF'
          Options -MultiViews
          RewriteEngine On
          RewriteCond %{REQUEST_FILENAME} -f [OR]
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]
          RewriteRule ^ index.html [L]

          <IfModule mod_headers.c>
            Header set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noimageindex"
          </IfModule>
          EOF

      - name: Deploy context debug (safe)
        run: |
          echo "Deploying to host: ${{ secrets.FTP_HOST }}"
          echo "Protocol: ftp"
          echo "Port: 21"
          echo "Target dir: ${{ secrets.FTP_TARGET_DIR }}"
          echo "Dist file count:"
          find dist -type f | wc -l

      - name: Upload to REG.RU via FTP
        id: deploy_ftp
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}
          # Инкрементальный деплой: action сравнивает state-файл и заливает только измененные файлы
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json
          timeout: 600000

      - name: Upload to REG.RU via FTPS (fallback)
        if: steps.deploy_ftp.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_TARGET_DIR }}
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json
          timeout: 600000
