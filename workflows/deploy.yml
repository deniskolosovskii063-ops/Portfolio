name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Grant the GITHUB_TOKEN the permissions needed for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment runs at a time; cancel any in-progress one
# when a new push arrives.
concurrency:
  group: pages
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Build ─────────────────────────────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Fetch latest asset map from Supabase so images always load ────────
      # The asset-map.json is populated once via the /migrate page migration
      # runner.  Every subsequent deploy fetches the current map automatically
      # so no manual re-migration is needed after code changes.
      - name: Fetch asset map from Supabase
        run: |
          echo "Fetching asset map from Supabase..."
          curl -sf \
            -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}" \
            "${{ vars.SUPABASE_URL }}/functions/v1/make-server-de62407f/assets/export-json" \
            -o src/asset-map.json \
          && echo "✓ asset-map fetched: $(wc -c < src/asset-map.json) bytes" \
          || echo "⚠ fetch failed – using committed asset-map.json"
        continue-on-error: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Set VITE_BASE to '/Portfolio/' in GitHub repo:
          # Settings → Variables → Actions → VITE_BASE = /Portfolio/
          VITE_BASE: ${{ vars.VITE_BASE || '/' }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ── 2. Deploy ────────────────────────────────────────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
