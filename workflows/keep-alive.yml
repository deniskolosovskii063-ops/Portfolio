name: Keep-Alive Supabase Server

# Runs every 2 days at 09:00 UTC — keeps the Supabase Edge Function warm
# so it doesn't go to sleep due to inactivity.
on:
  schedule:
    - cron: '0 9 */2 * *'
  workflow_dispatch: # allows manual trigger from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase server
        run: |
          echo "Pinging Supabase Edge Function at $(date -u)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ vars.SUPABASE_ANON_KEY }}" \
            "${{ vars.SUPABASE_URL }}/functions/v1/make-server-de62407f/ping")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✓ Server is alive"
          else
            echo "⚠ Unexpected status: $STATUS"
            exit 1
          fi
